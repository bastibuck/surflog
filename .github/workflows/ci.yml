name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - run: pnpm -r i --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r build
      - run: pnpm -r test
        env:
          DATABASE_URL: postgresql://username:password@localhost:5432/database_name # fake URL we are not using in tests and only provide for start-up
      - name: validate openapi spec is up to date
        run: pnpm --filter backend openapi:generate && git diff --exit-code
